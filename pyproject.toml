[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hogar-de-los-alpes-servicio-dddesacoplados"
version = "0.1.0"
description = "Servicio Entrada de Solicitudes de Partner"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
